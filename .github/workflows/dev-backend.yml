name: "Dev: Backend"

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "backend/**"

concurrency:
  group: dev-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [listing, messaging]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ./backend/${{ matrix.service }}-service/package-lock.json

      - run: npm ci
        working-directory: ./backend/${{ matrix.service }}-service

      - run: npm run lint -- --max-warnings 0
        working-directory: ./backend/${{ matrix.service }}-service

  security-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [listing, messaging]
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk
        uses: snyk/actions/node@0.4.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=backend/${{ matrix.service }}-service/package-lock.json

  build-and-push:
    needs: [lint, security-scan]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [listing, messaging]
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/${{ matrix.service }}-service
          file: ./backend/${{ matrix.service }}-service/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/nusiss-team-1-voc/tcgm-${{ matrix.service }}:develop-latest
            ${{ steps.login-ecr.outputs.registry }}/nusiss-team-1-voc/tcgm-${{ matrix.service }}:develop-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [listing, messaging]
    environment: dev
    concurrency:
      group: dev-deploy-${{ matrix.service }}
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition nusiss-team-1-voc-${{ matrix.service }}-service \
            --query taskDefinition \
            > task-def.json

      - name: Update image in task definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: task-def.json
          container-name: app
          image: ${{ steps.login-ecr.outputs.registry }}/nusiss-team-1-voc/tcgm-${{ matrix.service }}:develop-latest

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: nusiss-team-1-voc-${{ matrix.service }}-service
          cluster: nusiss-team-1-voc-cluster
          wait-for-service-stability: true

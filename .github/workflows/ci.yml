
name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend-listing: ${{ steps.filter.outputs.backend-listing }}
      backend-messaging: ${{ steps.filter.outputs.backend-messaging }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend-listing:
              - 'backend/listing-service/**'
            backend-messaging:
              - 'backend/messaging-service/**'

  lint-backend-listing:
    needs: changes
    if: ${{ needs.changes.outputs.backend-listing == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ./backend/listing-service/package-lock.json

      - run: npm ci
        working-directory: ./backend/listing-service

      - run: npm run lint -- --max-warnings 0
        working-directory: ./backend/listing-service

  lint-backend-messaging:
    needs: changes
    if: ${{ needs.changes.outputs.backend-messaging == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ./backend/messaging-service/package-lock.json

      - run: npm ci
        working-directory: ./backend/messaging-service

      - run: npm run lint -- --max-warnings 0
        working-directory: ./backend/messaging-service

  lint-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - run: npm ci
        working-directory: ./frontend

      - run: npm run lint -- --max-warnings 0
        working-directory: ./frontend

  test-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - run: npm ci
        working-directory: ./frontend

      - run: npm test
        working-directory: ./frontend

  security-scan-backend-listing:
    needs: changes
    if: ${{ needs.changes.outputs.backend-listing == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk
        uses: snyk/actions/node@0.4.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=backend/listing-service/package-lock.json

  security-scan-backend-messaging:
    needs: changes
    if: ${{ needs.changes.outputs.backend-messaging == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk
        uses: snyk/actions/node@0.4.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=backend/messaging-service/package-lock.json

  security-scan-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk
        uses: snyk/actions/node@0.4.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=frontend/package-lock.json

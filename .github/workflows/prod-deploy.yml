name: "Prod: Deploy"

on:
  push:
    branches: [main]
    paths:
      - "deploy.yaml"

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      listing_changed: ${{ steps.diff.outputs.listing_changed }}
      messaging_changed: ${{ steps.diff.outputs.messaging_changed }}
      web_changed: ${{ steps.diff.outputs.web_changed }}
      listing_image_tag: ${{ steps.tags.outputs.listing_image_tag }}
      listing_source_tag: ${{ steps.tags.outputs.listing_source_tag }}
      messaging_image_tag: ${{ steps.tags.outputs.messaging_image_tag }}
      messaging_source_tag: ${{ steps.tags.outputs.messaging_source_tag }}
      web_image_tag: ${{ steps.tags.outputs.web_image_tag }}
      web_source_tag: ${{ steps.tags.outputs.web_source_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect which image tags changed
        id: diff
        run: |
          OLD=$(git show HEAD~1:deploy.yaml 2>/dev/null || echo "")
          NEW=$(cat deploy.yaml)

          old_listing=$(echo "$OLD" | yq '.prod.listing_image_tag' 2>/dev/null || echo "")
          new_listing=$(echo "$NEW" | yq '.prod.listing_image_tag')
          old_messaging=$(echo "$OLD" | yq '.prod.messaging_image_tag' 2>/dev/null || echo "")
          new_messaging=$(echo "$NEW" | yq '.prod.messaging_image_tag')
          old_web=$(echo "$OLD" | yq '.prod.web_image_tag' 2>/dev/null || echo "")
          new_web=$(echo "$NEW" | yq '.prod.web_image_tag')

          echo "listing_changed=$( [ "$old_listing" != "$new_listing" ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "messaging_changed=$( [ "$old_messaging" != "$new_messaging" ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "web_changed=$( [ "$old_web" != "$new_web" ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Read image tags from manifest
        id: tags
        run: |
          echo "listing_image_tag=$(yq '.prod.listing_image_tag' deploy.yaml)" >> $GITHUB_OUTPUT
          echo "listing_source_tag=$(yq '.prod.listing_source_tag' deploy.yaml)" >> $GITHUB_OUTPUT
          echo "messaging_image_tag=$(yq '.prod.messaging_image_tag' deploy.yaml)" >> $GITHUB_OUTPUT
          echo "messaging_source_tag=$(yq '.prod.messaging_source_tag' deploy.yaml)" >> $GITHUB_OUTPUT
          echo "web_image_tag=$(yq '.prod.web_image_tag' deploy.yaml)" >> $GITHUB_OUTPUT
          echo "web_source_tag=$(yq '.prod.web_source_tag' deploy.yaml)" >> $GITHUB_OUTPUT

  deploy-listing:
    if: needs.detect-changes.outputs.listing_changed == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: prod-deploy-listing
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Re-tag image as version
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: nusiss-team-1-voc/tcgm-listing
          SOURCE: ${{ needs.detect-changes.outputs.listing_source_tag }}
          VERSION: ${{ needs.detect-changes.outputs.listing_image_tag }}
        run: |
          MANIFEST=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$SOURCE" --query 'images[0].imageManifest' --output text)
          aws ecr put-image --repository-name "$REPO" --image-tag "$VERSION" --image-manifest "$MANIFEST" || true

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition nusiss-team-1-voc-prod-listing-service \
            --query taskDefinition \
            > task-def.json

      - name: Update image in task definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: task-def.json
          container-name: app
          image: ${{ steps.login-ecr.outputs.registry }}/nusiss-team-1-voc/tcgm-listing:${{ needs.detect-changes.outputs.listing_image_tag }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: nusiss-team-1-voc-prod-listing-service
          cluster: nusiss-team-1-voc-prod-cluster
          wait-for-service-stability: true

  deploy-messaging:
    if: needs.detect-changes.outputs.messaging_changed == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: prod-deploy-messaging
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Re-tag image as version
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: nusiss-team-1-voc/tcgm-messaging
          SOURCE: ${{ needs.detect-changes.outputs.messaging_source_tag }}
          VERSION: ${{ needs.detect-changes.outputs.messaging_image_tag }}
        run: |
          MANIFEST=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$SOURCE" --query 'images[0].imageManifest' --output text)
          aws ecr put-image --repository-name "$REPO" --image-tag "$VERSION" --image-manifest "$MANIFEST" || true

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition nusiss-team-1-voc-prod-messaging-service \
            --query taskDefinition \
            > task-def.json

      - name: Update image in task definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: task-def.json
          container-name: app
          image: ${{ steps.login-ecr.outputs.registry }}/nusiss-team-1-voc/tcgm-messaging:${{ needs.detect-changes.outputs.messaging_image_tag }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: nusiss-team-1-voc-prod-messaging-service
          cluster: nusiss-team-1-voc-prod-cluster
          wait-for-service-stability: true

  deploy-web:
    if: needs.detect-changes.outputs.web_changed == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: prod-deploy-web
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Re-tag image as version
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: nusiss-team-1-voc/tcgm-web
          SOURCE: ${{ needs.detect-changes.outputs.web_source_tag }}
          VERSION: ${{ needs.detect-changes.outputs.web_image_tag }}
        run: |
          MANIFEST=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$SOURCE" --query 'images[0].imageManifest' --output text)
          aws ecr put-image --repository-name "$REPO" --image-tag "$VERSION" --image-manifest "$MANIFEST" || true

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition nusiss-team-1-voc-prod-web \
            --query taskDefinition \
            > task-def.json

      - name: Update image in task definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: task-def.json
          container-name: web
          image: ${{ steps.login-ecr.outputs.registry }}/nusiss-team-1-voc/tcgm-web:${{ needs.detect-changes.outputs.web_image_tag }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: nusiss-team-1-voc-prod-web-service
          cluster: nusiss-team-1-voc-prod-cluster
          wait-for-service-stability: true
